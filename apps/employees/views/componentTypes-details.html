{{define "content"}}

<h4>Edit Salary Component / {{.ComponentType.ID}}</h4>

<form method="POST">
    <table>
        <tbody>
            <tr>
                <th>Code</th><th><input type="text" name="code" value="{{.ComponentType.Code}}"></th>
            </tr>
            <tr>
                <th>Name</th><th><input type="text" name="name" value="{{.ComponentType.Name}}"></th>
            </tr>
          
        </tbody>
    </table>
    <br>
    <button class="btn btn-primary">Update</button>
</form>

{{end}}

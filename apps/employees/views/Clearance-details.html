 {{define "content"}}
  <h3>Clearance  / Details : {{.Clearance.ID}}</h3>

  <form method="POST">

 <table>
        <tr>
            <td>Employee Name</td>
        <td>
            <input type="text" name="EmployeeName" value="{{.Clearance.Employee.Name}}" readonly/>
        </td>
        </tr>

        <tr>
            <td>Badge ID</td>
        <td>
            <input type="text" name="BadgeID" value="{{.Clearance.Employee.BadgeID}}" readonly/>
        </td>
        </tr>

        <tr>
            <td>Clearance Template</td>
        <td>
            <input type="text" name="ClearanceTemplate" value="{{.Clearance.Template.Name}}" readonly/>
        </td>
        </tr>

        <tr>
            <td>Status</td>
            <td>
                <input type="text" name="Status" value="{{.Clearance.Status}}" readonly/>
            </td>
        </tr>
        <tr>
            <td>Requested Date</td>
            <td>
                <input type="text" name="RequestedDate" value='{{.Clearance.RequestedDate.Format "2006-01-02"}}' readonly/>
            </td>
        </tr>

        <tr>
            <td>Completed Date</td>
            <td>
                <input type="text" name="CompletedDate" value='{{if .Clearance.CompletedDate}}{{.Clearance.CompletedDate.Format "2006-01-02"}}{{end}}' readonly/>
            </td>
        </tr>
        <tr>
            <td>Contract Id</td>
            <td>
                <input type="text" name="ContractId" value="{{.Clearance.Contract.ID}}" readonly/>
            </td>
        </tr>
</table>

<hr>

<table>
        <header>
            <tr>
                <th>Name</th>
                <th>Department</th>
               
                <th>Responsible Employee</th>

                 <th>Status</th>
            </tr>
        </header>
        <tbody>
            {{range .Clearance.ClearanceItems}}
            <tr>
                <td>{{.Name}}</td>
                <td>{{.Department.Name}}</td>
               

                <td>
                    <select class="dept-employee-select" data-dept-id="{{.Department.ID}}" name="ResponsibleEmployee[{{.ID}}]">
                        <option value="">-- Select Employee --</option>
                    </select>
               </td>

                <td>{{.Status}}</td>
            </tr>
            {{end}}
        </tbody>
</table>

<hr>
<button type="submit" class="btn btn-primary">Send For Approvals</button>

  </form>

<script>
document.addEventListener("DOMContentLoaded", function () {
    // Find all the dropdowns that need population
    const dropdowns = document.querySelectorAll('.dept-employee-select');

    dropdowns.forEach(selectElement => {
        const departmentId = selectElement.getAttribute('data-dept-id');
        if (departmentId) {
            fetchEmployeeList(departmentId, selectElement);
        }
    });
});

function fetchEmployeeList(departmentId, selectElement) {
    fetch(`/api/departments/${departmentId}/employees`)
        .then(response => {
            if (!response.ok) throw new Error('Network response was not ok');
            return response.json();
        })
        .then(data => {
            // Keep the default option
            selectElement.innerHTML = '<option value="">-- Select Employee --</option>';
            
            // Populate new options
            data.forEach(employee => {
                const option = document.createElement('option');
                option.value = employee.id;
                option.textContent = employee.name + ' (' + employee.badge_id + ')' + employee.local_name;
                selectElement.appendChild(option);
            });
        })
        .catch(error => console.error(`Error fetching employees for dept ${departmentId}:`, error));
}
</script>

  {{end}}

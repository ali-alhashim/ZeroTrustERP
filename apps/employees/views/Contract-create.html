<table id="SalaryComponentsTable">
    <thead>
        <tr>
           <th>Type</th> <th>Amount</th> <th>Action</th>

    <tbody>
        <!-- This is the initial row -->
        <tr>
            <td>
                <select name="SalaryComponentType" class="form-control">

                    <option>Telecom</option>

            </td>

                <button type="button" class="btn btn-danger btn-sm" onclick="RemoveRow(this)">Delete</button>
            </td>
        </tr>
    </tbody>

   <tfoot>
    <tr style="font-weight: bold; background-color: #f8f9fa;">
        <td>Net Salary</td>

        <td><input type="text" name="NetSalary" id="TotalNetSalary"/></td>

        <td></td>
    </tr>
</tfoot>


</table>
<button type="button" class="btn btn-secondary" onclick="AddSalaryComponent()">Add+</button>
<hr>







<button type="submit" class="btn btn-primary m-5">Create Contract</button>

</form>



<script>
    document.addEventListener('DOMContentLoaded', function() {
        
        const ManagerSelect = document.getElementById('ManagerSelect');

        // Fetch employees and populate the select
        fetch('/api/employees/list')
            .then(response => response.json())
            .then(data => {
                console.log('Employees data:', data); // Debugging log
                data.forEach(employee => {
                    const option = document.createElement('option');
                    option.value = employee.ID;
                    option.textContent ="(" + employee.BadgeID + ") " + employee.Name + " (" + employee.LocalName + ") - " + employee.ID;
                    ManagerSelect.appendChild(option);
                });
            })
            .catch(error => console.error('Error fetching employees:', error));


             selectSearch();
          });
</script>





<script>
    document.addEventListener('DOMContentLoaded', function() {
      
        const jobTitleSelect = document.querySelector('select[name="jobTitleId"]');

     
        // Fetch job titles and populate the select
        fetch('/api/job-titles/list')
            .then(response => response.json())
            .then(data => {
                data.forEach(jobTitle => {
                    console.log('Job Title:', jobTitle); // Debugging log
                    const option = document.createElement('option');
                    option.value = jobTitle.ID;
                    option.textContent = jobTitle.Name + " (" + jobTitle.LocalName + ") - " + jobTitle.ID;
                    jobTitleSelect.appendChild(option);
                });
            })
            .catch(error => console.error('Error fetching job titles:', error));
    });
</script>




<script>
 function AddSalaryComponent() {
    // 1. Get the table body
    const tableBody = document.querySelector('#SalaryComponentsTable tbody');
    
    // 2. Create a new row element
    const newRow = document.createElement('tr');
    
    // 3. Set the inner HTML for the new row
    // Note: Use backticks `` for multi-line strings
    newRow.innerHTML = `
        <td>
            <select name="SalaryComponentType" class="form-control">
                <option>Housing</option>
                <option>Transport</option>
                <option>Telecom</option>
                <option>GOSI</option>
            </select>
        </td>
        <td>
            <input type="number" name="Amount" class="form-control">
        </td>
        <td>
            <button type="button" class="btn btn-danger btn-sm" onclick="RemoveRow(this)">Delete</button>
        </td>
    `;
    
    // 4. Append the row to the table
    tableBody.appendChild(newRow);
}





function calculateTotalSalary() {
    // 1. Get Base Salary
    const baseSalaryInput = document.getElementById('BaseSalary');

    let total = parseFloat(baseSalaryInput.value) || 0;

    // 2. Get all dynamic component amounts
    const componentAmounts = document.querySelectorAll('input[name="Amount"]');
    
    componentAmounts.forEach(input => {
        let val = parseFloat(input.value) || 0;
        total += val;
    });

    // 3. Update the display
    document.getElementById('TotalNetSalary').value = total.toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });
}

// Add event listeners to existing elements and the document for dynamic ones
document.addEventListener('input', function (e) {
    if (e.target.name === 'Amount' || e.target.id === 'BaseSalary') {
        calculateTotalSalary();
    }
});

// Update RemoveRow to recalculate after deleting a row
function RemoveRow(button) {
    const row = button.closest('tr');
    row.remove();
    calculateTotalSalary(); // Recalculate after removal
}
</script>
